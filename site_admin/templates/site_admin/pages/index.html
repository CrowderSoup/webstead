{% extends "site_admin/base.html" %}

{% block title %}Pages{% endblock %}

{% block content %}
  <div class="flex flex-col gap-6">
    <section class="flex flex-wrap items-end justify-between gap-4">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.24em] text-(--admin-muted)">Content</p>
          <h1 class="mt-2 text-2xl font-semibold">Pages</h1>
          <p class="mt-1 text-sm text-(--admin-muted)">Manage evergreen content and key site pages.</p>
        </div>
        <a
          href="{% url 'site_admin:page_create' %}"
          class="rounded-xl bg-(--admin-accent) px-4 py-2 text-sm font-semibold text-white transition hover:bg-(--admin-accent-strong)"
        >
          + New page
        </a>
      </div>
    </section>

    <section class="rounded-3xl border border-(--admin-border) bg-(--admin-surface) p-6 shadow-xs">
      <form
        id="page-filter"
        method="get"
        class="flex flex-col gap-3 sm:flex-row sm:items-end"
        hx-get="{% url 'site_admin:page_list' %}"
        hx-target="#page-list"
        hx-push-url="true"
        hx-trigger="keyup delay:400ms, change"
      >
        <div class="flex-1">
          <label for="{{ filter_form.q.id_for_label }}" class="sr-only">Search pages</label>
          {{ filter_form.q }}
        </div>
        <button
          type="submit"
          class="rounded-xl border border-(--admin-border) px-4 py-2 text-sm font-semibold text-(--admin-ink) transition hover:bg-(--admin-bg)"
        >
          Filter
        </button>
      </form>
      <div id="page-list" class="mt-6">
        {% include "site_admin/pages/_list.html" %}
      </div>
    </section>
  </div>
{% endblock %}
